name: "Docker Publish (GHCR)"

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
      - "web-import"
    tags:
      - "v*"

concurrency:
  group: docker-publish-${{ github.ref }}-1
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          registry: ${{ env.REGISTRY }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build binaries
        run: |
          set -euo pipefail
          VERSION=$(git describe --tags)
          DATE=$(date -u +%Y%m%d.%H%M%S)

          # goreleaser-style layout: dist/shiori_<os>_<arch[_legacy-name]>/shiori
          for target in "linux amd64 amd64_v1" "linux arm64 arm64_v8.0"; do
            read -r os arch dirname <<< "$target"
            mkdir -p "dist/shiori_${os}_${dirname}"
            CGO_ENABLED=0 GIN_MODE=release GOOS="${os}" GOARCH="${arch}" go build \
              -tags "osusergo,netgo,fts5" \
              -ldflags "-s -w -X main.version=${VERSION} -X main.date=${DATE}" \
              -o "dist/shiori_${os}_${dirname}/shiori" .
          done

          # buildx.sh-style rename into the plain-arch names the Dockerfile expects
          cp -r dist/shiori_linux_amd64_v1 dist/shiori_linux_amd64
          cp -r dist/shiori_linux_arm64_v8.0 dist/shiori_linux_arm64
          ls dist/

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
